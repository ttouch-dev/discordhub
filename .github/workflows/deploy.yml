name: Deploy DiscordHub to Contabo

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Contabo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy DiscordHub
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}

          script: |
            set -e

            echo "======================================"
            echo "Starting DiscordHub Deployment"
            echo "======================================"

            # -----------------------------------------
            # Project directory
            # -----------------------------------------
            cd /var/www/discordhub

            echo "Current directory:"
            pwd

            # -----------------------------------------
            # Get latest code
            # -----------------------------------------
            echo "Getting latest code from GitHub..."

            git fetch origin
            git reset --hard origin/main

            echo "Latest commit:"
            git log -1 --oneline

            # -----------------------------------------
            # Backend
            # -----------------------------------------
            echo "======================================"
            echo "Updating Backend"
            echo "======================================"

            cd /var/www/discordhub/backend

            echo "Installing backend dependencies..."
            npm ci --omit=dev

            # Check production environment file
            if [ ! -f .env ]; then
              echo "ERROR: /var/www/discordhub/backend/.env not found!"
              exit 1
            fi

            # -----------------------------------------
            # Restart or start backend with PM2
            # -----------------------------------------
            echo "Starting/Restarting DiscordHub backend..."

            if pm2 describe discordhub-backend > /dev/null 2>&1; then
              echo "Existing PM2 process found."
              pm2 restart discordhub-backend --update-env
            else
              echo "PM2 process not found. Starting new process..."
              pm2 start npm \
                --name "discordhub-backend" \
                --cwd /var/www/discordhub/backend \
                -- start
            fi

            # -----------------------------------------
            # Frontend
            # -----------------------------------------
            echo "======================================"
            echo "Building Frontend"
            echo "======================================"

            cd /var/www/discordhub/frontend

            echo "Installing frontend dependencies..."
            npm ci

            echo "Building frontend..."
            npm run build

            # -----------------------------------------
            # Save PM2 configuration
            # -----------------------------------------
            echo "Saving PM2 configuration..."

            pm2 save

            # -----------------------------------------
            # Show status
            # -----------------------------------------
            echo "======================================"
            echo "PM2 Status"
            echo "======================================"

            pm2 list

            echo "======================================"
            echo "DiscordHub Deployment Completed"
            echo "======================================"